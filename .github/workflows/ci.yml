name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore QuanLyPhongKham_UNETI_05_DHTI17A1Hn.slnx

      - name: Build
        run: dotnet build QuanLyPhongKham_UNETI_05_DHTI17A1Hn.slnx --no-restore -c Release

      - name: Publish
        run: dotnet publish QuanLyPhongKham_UNETI_05_DHTI17A1Hn/QuanLyPhongKham_UNETI_05_DHTI17A1Hn.csproj -c Release -o ./publish --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
